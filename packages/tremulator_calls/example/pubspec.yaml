name: tremulator_calls_example
description: >-
  Hosts the tremulator_calls integration tests: the calls need the native
  WebRTC plugin, which only runs inside a Flutter app.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # unimported: the plugin under test. Only integration_test/ imports it;
  # the app must depend on it for its native code to be built and registered.
  tremulator_calls:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_webrtc: 1.6.3
  http: ^1.6.0
  integration_test:
    sdk: flutter
  tremulator_client:
    path: ../../tremulator_client
  tremulator_keys:
    path: ../../tremulator_keys
  tremulator_mailbox:
    path: ../../tremulator_mailbox
  tremulator_test_server:
    path: ../../tremulator_test_server
  very_good_analysis: ^10.0.0

# flutter_webrtc 1.6.3 with the desktop `fieldTrials` initialize option
# (third_party/flutter_webrtc/TREMULATOR-PATCH.md).
dependency_overrides:
  flutter_webrtc:
    path: ../../../third_party/flutter_webrtc
