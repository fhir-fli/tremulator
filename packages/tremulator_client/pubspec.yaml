name: tremulator_client
description: >-
  A phone without a screen: joins tremulator_keys and tremulator_mailbox into
  one client that registers, starts conversations, sends and receives. The
  app and the lab's measurement runs both use it.
version: 0.1.0
publish_to: none
repository: https://github.com/fhir-fli/tremulator

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  http: ^1.6.0
  tremulator_keys:
    path: ../tremulator_keys
  tremulator_mailbox:
    path: ../tremulator_mailbox

dev_dependencies:
  test: ^1.29.0
  tremulator_test_server:
    path: ../tremulator_test_server
  very_good_analysis: ^10.0.0
