name: tremulator_test_server
description: >-
  A fhirant started inside the test process on a free port. Test-only: the
  mailbox, client and calls suites all talk to a real server through it.
version: 0.1.0
publish_to: none
repository: https://github.com/fhir-fli/tremulator

environment:
  sdk: ^3.10.0

dependencies:
  drift: ^2.29.0
  fhirant_db:
    path: ../../../fhirant/packages/fhirant_db
  fhirant_server:
    path: ../../../fhirant/packages/fhirant_server

dev_dependencies:
  very_good_analysis: ^10.0.0
