name: tremulator
description: >-
  Secure clinician-to-clinician messaging and calls. For now: a lab mode,
  driven by command-line flags, that places or answers one call and logs
  what it measures. The screens come before the Android step.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  # The browser build's track hint (lab_host_web.dart markAsCamera).
  dart_webrtc: ^1.8.0
  flutter:
    sdk: flutter
  flutter_webrtc: 1.6.3
  # The browser build's lab log and stop sign (lab_host_web.dart).
  http: ^1.6.0
  # unimported: tremulator_keys is the only importer. Listed so the
  # web build gets the encryption library's WASM module: openmls's build
  # hook (hook/build.dart, _findAppRoot) copies it into web/pkg/ only for an
  # app whose own pubspec names openmls ("Could not find Flutter app root
  # for web build" otherwise, 2026-11-19).
  openmls: ^3.3.0
  tremulator_calls:
    path: ../packages/tremulator_calls
  tremulator_client:
    path: ../packages/tremulator_client
  tremulator_keys:
    path: ../packages/tremulator_keys
  tremulator_mailbox:
    path: ../packages/tremulator_mailbox

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: false
